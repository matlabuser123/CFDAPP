[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cfdapp-tools"
version = "0.1.0"
description = "Validation, plotting, and benchmark automation for CFDApp -- consumes exported CFDApp results, never reimplements the CFD numerical core."
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.0",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
include = ["cfdapp*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# No formatting/linting policy existed before this package (TODO.md "P1
# -- Python Tooling" section 4: "add formatting/linting only according to
# the project's quality policy") -- this is a minimal one, line length
# matched to the C++ side's own ~100-column convention rather than
# PEP8's default 79.
[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
