name: CI

# TODO.md "P1 -- Quality Gate" sections 30-39: every pull request proves
# configure/build/test, format, static analysis, sanitizers, and Python
# quality, as separate jobs so a failure is obvious at a glance (section
# 32) rather than buried inside one monolithic job.
#
# Intentionally NOT run here (section 38): the 20-40 minute
# 40x40/80x80/256x32 Ghia/Poiseuille grid-refinement validation cases.
# Those stay DISABLED_ (see tests/integration/cavity/test_cavity_ghia.cpp
# and tests/integration/poiseuille/test_poiseuille_validation.cpp) and are
# therefore already excluded from a plain `ctest` run in every job below
# -- CI stays fast without needing a separate slow/fast CTest label
# filter for that split. `ctest -L validation` (see cmake/Testing.cmake)
# is for selecting a *tier* on demand, not this split.
#
# No defaults.run.working-directory -- a real run found the previous
# `working-directory: CFDApp` assumed a nested CFDApp/ checkout
# subdirectory that does not exist in how this repository actually lays
# out (project files sit at the repo root; $GITHUB_WORKSPACE already *is*
# the project root), failing every step with "directory name is
# invalid"/"No such file or directory" before it could run anything.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # --- section 33: build-test, matrixed per section 31 --------------------
  # Parallelised and sharded (CI-PERF-001, 2026-09-18). Measured on run
  # 35352132866 (the green qualification of c1355ea), this job was the whole
  # pipeline's critical path at 276 min:
  #
  #   clang debug   build 5.5 min + test 270.1 min = 276.3 min
  #   gcc   debug   build 3.0 min + test 227.1 min = 230.7 min
  #   gcc   release build 5.0 min + test  33.0 min =  38.5 min
  #
  # Two causes, both fixed here, neither of which drops or weakens a test:
  #
  # 1. The test step ran SERIALLY. CMakePresets.json's testPresets carry no
  #    "jobs" field, so a bare `ctest --preset X` uses one worker -- while the
  #    sanitizers job has run the very same 1977-test population under
  #    `-j$(nproc)` for months, so parallel execution of this suite is already
  #    proven on this runner at a strictly harsher configuration (ASan/UBSan
  #    memory and time overhead on top). Adding -j$(nproc) here is the single
  #    largest win: ~4x on a 4-vCPU runner.
  #
  # 2. Even parallel, one job still serialised 270 min of tests. The suite is
  #    extremely skewed (mean 8.4 s, slowest single test 890 s), so the shards
  #    are balanced by MEASURED RUNTIME, not by test count -- see
  #    scripts/ci/shard_tests.py. Stride sharding (`-I <shard>,,N`) balances
  #    count and produced a 65..101 min spread on the sanitizer job; LPT
  #    assignment over the recorded times gives a 1.00x spread.
  #
  # Predicted here: clang debug 3 shards -> 22.5 min of tests each, gcc debug
  # 3 -> 18.9 min, gcc release 1 -> 8.3 min. The floor no partition can beat
  # is the heaviest single test (890 s clang / 750 s gcc).
  #
  # --timeout 7200 is NEW and is a hang guard only: this job previously had no
  # timeout at all, so a deadlock consumed the full 6h job limit before
  # failing. 7200 s is >=4.8x the slowest measured test even allowing for -j
  # contention.
  build-test:
    name: build-test (${{ matrix.group }} ${{ matrix.shard }}/${{ matrix.shards }})
    strategy:
      fail-fast: false # one shard's failure must not hide the others' results
      matrix:
        include:
          - { compiler: gcc, build_type: release, group: gcc-release, shard: 1, shards: 1 }
          - { compiler: gcc, build_type: debug, group: gcc-debug, shard: 1, shards: 3 }
          - { compiler: gcc, build_type: debug, group: gcc-debug, shard: 2, shards: 3 }
          - { compiler: gcc, build_type: debug, group: gcc-debug, shard: 3, shards: 3 }
          - { compiler: clang, build_type: debug, group: clang-debug, shard: 1, shards: 3 }
          - { compiler: clang, build_type: debug, group: clang-debug, shard: 2, shards: 3 }
          - { compiler: clang, build_type: debug, group: clang-debug, shard: 3, shards: 3 }
    runs-on: ubuntu-latest
    env:
      CC: ${{ matrix.compiler == 'clang' && 'clang' || 'gcc' }}
      CXX: ${{ matrix.compiler == 'clang' && 'clang++' || 'g++' }}
      # Runtime-table key. gcc-release is unsharded, so it needs no weights.
      RUNTIME_CONFIG: ${{ matrix.compiler }}_${{ matrix.build_type }}
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: sudo apt-get update -q && sudo apt-get install -y -q ninja-build ccache

      # ccache is keyed by compiler+build type so Debug/Release and gcc/clang
      # objects can never be served to one another; ccache itself hashes the
      # preprocessed source, the compiler binary and the full flag set, so a
      # changed source or flag is a miss, not a stale hit. A miss compiles
      # normally -- the cache can make a build faster, never different.
      - name: Restore ccache
        uses: actions/cache/restore@v4
        with:
          path: ~/.ccache
          key: ccache-${{ matrix.group }}-${{ github.sha }}
          restore-keys: ccache-${{ matrix.group }}-

      - name: Configure (${{ matrix.compiler }}, ${{ matrix.build_type }})
        run: cmake --preset ${{ matrix.build_type }} -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build
        run: |
          ccache --zero-stats >/dev/null
          cmake --build --preset ${{ matrix.build_type }} -- -j$(nproc)
          ccache --show-stats

      # Only one shard per group writes the cache: parallel shards racing on
      # the same key would have all but the first fail their upload anyway.
      - name: Save ccache
        if: matrix.shard == 1
        uses: actions/cache/save@v4
        with:
          path: ~/.ccache
          key: ccache-${{ matrix.group }}-${{ github.sha }}

      # Recorded from the same configured build that runs the tests, so the
      # audit reflects reality rather than a re-derivation elsewhere.
      - name: Select this shard's tests
        run: |
          set -euo pipefail
          FULL="${{ matrix.group }}__full__${{ matrix.shard }}.txt"
          SEL="${{ matrix.group }}__sel__${{ matrix.shard }}.txt"
          ctest --preset ${{ matrix.build_type }} -N > "$FULL"
          : > shard_indices.txt
          if [ "${{ matrix.shards }}" -gt 1 ]; then
            python3 scripts/ci/shard_tests.py --list-file "$FULL" --config "$RUNTIME_CONFIG" \
              --shards ${{ matrix.shards }} --shard ${{ matrix.shard }} > shard_indices.txt
            ctest --preset ${{ matrix.build_type }} -N -I "0,0,0,$(cat shard_indices.txt)" > "$SEL"
          else
            cp "$FULL" "$SEL"
          fi
          echo "full $(grep -cE '^ *Test +#' "$FULL"), this shard $(grep -cE '^ *Test +#' "$SEL")"

      - name: Test
        run: |
          set -o pipefail
          if [ -s shard_indices.txt ]; then
            SELECT=(-I "0,0,0,$(cat shard_indices.txt)")
          else
            SELECT=()
          fi
          ctest --preset ${{ matrix.build_type }} -j"$(nproc)" --output-on-failure \
            --timeout 7200 "${SELECT[@]}" 2>&1 | tee ctest_output.txt

      # Tests that produced a real result -- Passed, ***Failed, ***Timeout,
      # ***Exception. Lines reading ***Not Run or ***Skipped are deliberately
      # excluded: ctest prints a line for every listed test whether or not it
      # ran, so matching every line would record a test that never executed as
      # if it had, and the audit below would then pass over a silently skipped
      # test. Disabled tests print "***Not Run (Disabled)" and drop out here,
      # which is correct -- the audit only requires the ENABLED set to have run.
      - name: Record the tests that executed
        if: always()
        run: |
          RUN="${{ matrix.group }}__run__${{ matrix.shard }}.txt"
          grep -vE '\*\*\*(Not Run|Skipped)' ctest_output.txt \
            | sed -n 's|^ *[0-9]*/[0-9]* *Test *#[0-9]*: *\([^ ]*\) .*|\1|p' \
            | sort -u > "$RUN"
          echo "executed $(wc -l < "$RUN")"

      - name: Upload this shard's test lists
        if: always() # the audit must also run when a shard fails
        uses: actions/upload-artifact@v4
        with:
          name: build-test-lists-${{ matrix.group }}-${{ matrix.shard }}
          path: |
            ${{ matrix.group }}__full__${{ matrix.shard }}.txt
            ${{ matrix.group }}__sel__${{ matrix.shard }}.txt
            ${{ matrix.group }}__run__${{ matrix.shard }}.txt
          retention-days: 14

  # --- section 33b: build-test shard coverage audit ---------------------------
  # Same guarantee the sanitizer job has had: prove from the shards' own
  # recorded lists that each group ran every test exactly once, that no shard
  # was empty, and that no enabled test was selected yet silently never
  # executed. Runs even when a shard fails, so a partition defect can never
  # hide behind a test failure. scripts/ci/selftest_audit.sh is this audit's
  # own negative control: 6 injected defects, all detected.
  build-test-coverage:
    needs: build-test
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download the shards' test lists
        uses: actions/download-artifact@v4
        with:
          pattern: build-test-lists-*
          path: lists
          merge-multiple: true

      - name: Each group's shards must cover its full test list exactly once
        run: python3 scripts/ci/audit_shards.py lists

  # --- section 34: format ---------------------------------------------------
  # Pinned to clang-format-18 explicitly (not the runner image's default
  # `clang-format`): a real CI failure showed ubuntu-latest moving from
  # 22.04 to 24.04 mid-project silently changed the default clang-format
  # version, and clang-format-14/15 vs. clang-format-18 give genuinely
  # different (mutually exclusive) answers for short-lambda-in-function-
  # call wrapping -- so an unpinned version drifts whenever GitHub updates
  # the runner image, independent of anything in this repo.
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install clang-format-18
        run: |
          wget -qO- https://apt.llvm.org/llvm.sh | sudo bash -s -- 18
          sudo apt-get install -y -q clang-format-18

      - name: clang-format-18 --dry-run --Werror
        run: |
          find include src apps tests \
            \( -name '*.cpp' -o -name '*.hpp' -o -name '*.h' \) -print0 |
          xargs -0 clang-format-18 --dry-run --Werror

  # --- section 35: clang-tidy ------------------------------------------------
  clang-tidy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: sudo apt-get update -q && sudo apt-get install -y -q ninja-build clang-tools

      - name: Configure (generates compile_commands.json)
        run: cmake --preset debug

      - name: Build (so fetched deps like nlohmann_json/googletest exist)
        run: cmake --build --preset debug -- -j$(nproc)

      - name: clang-tidy (production include/ + src/ only)
        run: run-clang-tidy -p build/debug -j$(nproc) '^(include|src)/.*\.(cpp|hpp)$'

  # --- section 36: sanitizers -------------------------------------------------
  # Sharded (2026-09-18). As one job this exceeded the 360-minute GitHub job
  # limit on the P12 lineage's first push (run 35259730403): cancelled at
  # 1958/1977 with zero ASan/UBSan/LSan diagnostics and zero test failures --
  # a wall-clock limit, not a defect. The suite costs 23.6 CPU-hours under
  # ASan (measured: this runner 83161s over 1919 tests before the cancel;
  # the local build/asan run 84813s over 1932, so runner ~= workstation per
  # test), and a 4-vCPU runner cannot fit that in 6h: modelling ctest's
  # greedy scheduler over the measured per-test times gives 6.36h for the
  # whole suite, which is exactly what happened.
  #
  # The partition is `ctest -I <shard>,,5`: test index i goes to shard
  # (i mod 5) + 1. Deterministic (CTest's index order is the registration
  # order of the configured build), exhaustive and disjoint by construction,
  # and audited for real by the sanitizer-coverage job below, which compares
  # the union of the shards' own `ctest -N` lists against the full list.
  # No sanitizer flag, option, timeout, tolerance or enabled/disabled-test
  # change: every test that ran before still runs, in exactly one shard.
  #
  # Modelled worst shard: 93 min of tests (+ ~6 min configure/build), a 3.8x
  # margin under the 360-minute limit; the floor is the heaviest single test
  # (NaturalConvectionValidation.GridConvergence, 3619s), which no partition
  # can split. Shard CPU-hours: 5.5 / 5.1 / 4.2 / 4.2 / 4.6.
  sanitizers:
    name: sanitizers (shard ${{ matrix.shard }}/5)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false # one shard's failure must not hide the others' results
      matrix:
        shard: [1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: sudo apt-get update -q && sudo apt-get install -y -q ninja-build ccache

      # Keyed separately from every build-test group, so sanitizer objects
      # (built with -fsanitize=address,undefined) can never be served to a
      # non-sanitized build or vice versa -- and ccache's own hash covers the
      # flags regardless, so the key is defence in depth, not the guarantee.
      - name: Restore ccache
        uses: actions/cache/restore@v4
        with:
          path: ~/.ccache
          key: ccache-asan-${{ github.sha }}
          restore-keys: ccache-asan-

      - name: Configure (ASan + UBSan)
        run: cmake --preset asan -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build
        run: |
          ccache --zero-stats >/dev/null
          cmake --build --preset asan -- -j$(nproc)
          ccache --show-stats

      - name: Save ccache
        if: matrix.shard == 1
        uses: actions/cache/save@v4
        with:
          path: ~/.ccache
          key: ccache-asan-${{ github.sha }}

      # Parallelized: CMakePresets.json's asan testPreset carries no "jobs"
      # field, so `ctest --preset asan` alone still runs serially -- this is
      # the one place that mattered (see TODO.md's own "a real CI wall-clock
      # inefficiency worth fixing later" note). No sanitizer flag, tolerance,
      # or disabled-test change anywhere, only how many ctest worker
      # processes run at once.
      #
      # -j8/--timeout 900 (this job's own prior values) were tuned against a
      # 32-core local workstation and, run for real here for the first time
      # (this job's very first push to CI), failed: 6 of the heaviest
      # validation tests (SST convergence, natural-convection 15x15,
      # channel-flow comparisons) blew past 900s -- github-hosted
      # ubuntu-latest runners carry only 4 vCPUs, so -j8 oversubscribes 2x,
      # and that contention under ASan/UBSan's own 2-3x overhead was enough
      # to push borderline-slow tests over the timeout. Zero actual ASan/
      # UBSan diagnostics anywhere in that failed run's log -- a scheduling
      # regression, not a memory-safety bug.
      #
      # Fixed the same way the Build step above already sizes itself
      # (-j$(nproc)) instead of a second hardcoded worker count, and
      # --timeout raised to 1800s -- generous headroom for a shared,
      # weaker-than-a-developer's-workstation runner, while still existing
      # purely so a real deadlock/hang fails loudly as a reported CTest
      # timeout instead of silently consuming the whole job's time budget.
      #
      # --timeout raised again, 1800s -> 7200s (P12-NUM closeout,
      # 2026-09-14). Since P12-COMP-002 the five
      # CompressibleCoupledProductionCaseTest cases timed out here at 1800s
      # (run 34705436662: all 5 Timeout, zero ASan/UBSan diagnostics) and the
      # P12-NUM grid-convergence / MMS studies are of the same length.
      # Measured with this same preset and ASAN/UBSAN options on a local
      # workstation (build/asan, all 1614 enabled tests, zero sanitizer
      # diagnostics): longest tests RepeatedRunIsDeterministic 2220s,
      # NaturalConvectionValidation.GridConvergence 1623s,
      # SIMPLEMMS.DistortedMesh 1423s, the other four coupled-compressible
      # cases ~1280s. This runner measured 1.12-1.43x (median 1.29) slower
      # than that workstation on 49 tests under -j16 contention, so these
      # need up to ~4000s here; 7200s keeps >=1.8x headroom while still
      # failing a genuine hang well inside the job's 6h limit (estimated
      # total job time ~3.5h). Again no sanitizer flag, tolerance, or
      # enabled/disabled-test change -- only the hang guard.
      # Recorded before the run so the coverage audit uses the same configured
      # build that executes the tests: the full list every shard sees, and
      # this shard's slice of it.
      #
      # CI-PERF-001 (2026-09-18): the slice is now balanced by MEASURED RUNTIME
      # rather than by `-I <shard>,,5`, which strided over the test index and so
      # balanced COUNT. Measured on run 35352132866, stride sharding gave
      # 65.5 / 101.2 / 72.4 / 93.4 / 65.5 min -- a 1.55x spread, with the whole
      # job paying for the worst shard. The suite costs 1382 min of serial ASan
      # test time over 1977 listed tests and is heavily skewed, so LPT
      # assignment over the recorded per-test times flattens the spread to
      # 1.00x. Partition semantics are unchanged: exhaustive, disjoint, every
      # test in exactly one shard, and audited for real below. No sanitizer
      # flag, option, timeout, tolerance or enabled/disabled-test change.
      #
      # The floor no partition can beat is the heaviest single test,
      # CompressibleCoupledProductionCaseTest.RepeatedRunIsDeterministic at
      # 4838 s (80.6 min) under ASan; at 5 shards this job is already at that
      # floor, which is why it stays at 5 rather than growing.
      - name: Record the test lists (full and this shard)
        run: |
          set -euo pipefail
          ctest --preset asan -N > "asan__full__${{ matrix.shard }}.txt"
          python3 scripts/ci/shard_tests.py --list-file "asan__full__${{ matrix.shard }}.txt" \
            --config asan --shards 5 --shard ${{ matrix.shard }} > shard_indices.txt
          ctest --preset asan -N -I "0,0,0,$(cat shard_indices.txt)" > "asan__sel__${{ matrix.shard }}.txt"
          echo "full $(grep -cE '^ *Test +#' "asan__full__${{ matrix.shard }}.txt"), this shard $(grep -cE '^ *Test +#' "asan__sel__${{ matrix.shard }}.txt")"

      - name: Test under ASan+UBSan (shard ${{ matrix.shard }}/5)
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=0
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=0
        run: |
          set -o pipefail
          ctest --preset asan -j"$(nproc)" --output-on-failure --timeout 7200 \
            -I "0,0,0,$(cat shard_indices.txt)" 2>&1 | tee ctest_output.txt

      # Passed / ***Failed / ***Timeout / ***Exception only -- ***Not Run and
      # ***Skipped are excluded so a test that never executed can never be
      # recorded as if it had. See the same step in build-test.
      - name: Record the tests that executed
        if: always()
        run: |
          grep -vE '\*\*\*(Not Run|Skipped)' ctest_output.txt \
            | sed -n 's|^ *[0-9]*/[0-9]* *Test *#[0-9]*: *\([^ ]*\) .*|\1|p' \
            | sort -u > "asan__run__${{ matrix.shard }}.txt"
          echo "executed $(wc -l < "asan__run__${{ matrix.shard }}.txt")"

      - name: Upload this shard's test lists
        if: always() # the audit must also run when a shard fails
        uses: actions/upload-artifact@v4
        with:
          name: sanitizer-lists-shard-${{ matrix.shard }}
          path: |
            asan__full__${{ matrix.shard }}.txt
            asan__sel__${{ matrix.shard }}.txt
            asan__run__${{ matrix.shard }}.txt
          retention-days: 14

  # --- section 36b: sanitizer shard coverage audit -----------------------------
  # The sanitizer suite is only as strong as the partition: this job proves,
  # from the shards' own recorded lists, that the five shards together run
  # every sanitizer test exactly once. It fails on any gap or overlap, and on
  # any disagreement about what the full list is. It runs even when a shard
  # fails, so a partition defect can never hide behind a test failure.
  sanitizer-coverage:
    needs: sanitizers
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download the shards' test lists
        uses: actions/download-artifact@v4
        with:
          pattern: sanitizer-lists-shard-*
          path: lists
          merge-multiple: true

      # Same audit the build-test shards use (scripts/ci/audit_shards.py), so
      # the two partitions are proved by one implementation with one negative
      # control (scripts/ci/selftest_audit.sh: 6 injected defects, all caught).
      # Strictly stronger than the inline check it replaces: that one proved
      # union == full list without overlap; this also fails an empty shard and
      # an enabled test that was selected but never reported a result.
      - name: Union of the shards must equal the full test list, without overlap
        run: |
          test -n "$(find lists -name 'asan__sel__*.txt' -print -quit)" \
            || { echo "FAIL: no sanitizer shard lists were uploaded"; exit 1; }
          python3 scripts/ci/audit_shards.py lists

  # --- section 37: python ------------------------------------------------------
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package + dev/lint tools
        run: python -m pip install -e "./python[dev]" ruff

      - name: pytest
        run: python -m pytest python/tests

      - name: compileall
        run: python -m compileall python/cfdapp

      - name: ruff check
        run: python -m ruff check python

      - name: ruff format --check
        run: python -m ruff format --check python
